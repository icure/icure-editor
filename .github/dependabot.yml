# Keeps the GitHub Actions used by the workflows up to date. They are pinned to commit SHAs;
# Dependabot bumps the SHA and its version comment together, as one grouped weekly pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
